name: V23.5C.2B Live Podcast Media Validation

on:
  workflow_dispatch:
    inputs:
      jobs_path:
        description: Validation job inventory
        required: true
        default: data/media-audit/v23.5c.1/jobs/validation_jobs.json
      job_limit:
        description: Optional test limit; leave blank for all 491 jobs
        required: false
        default: ''

concurrency:
  group: v23-5c-2b-live-podcast-media-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/podcast_media_audit/requirements.txt

      - name: Install validator dependencies
        run: pip install -r tools/podcast_media_audit/requirements.txt

      - name: Validate prepared inventory
        env:
          JOBS_PATH: ${{ inputs.jobs_path }}
        run: |
          test -f "$JOBS_PATH"
          python -m json.tool "$JOBS_PATH" >/dev/null
          python - <<'PY'
          import json, os
          path = os.environ['JOBS_PATH']
          doc = json.load(open(path, encoding='utf-8'))
          jobs = doc.get('jobs', [])
          if not jobs:
              raise SystemExit('Validation inventory contains no jobs')
          print(f'Prepared validation jobs: {len(jobs)}')
          PY

      - name: Run live validation
        env:
          JOBS_PATH: ${{ inputs.jobs_path }}
          JOB_LIMIT: ${{ inputs.job_limit }}
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p audit-artifact
          if [ -n "$JOB_LIMIT" ]; then
            LIMIT_ARGS="--limit $JOB_LIMIT"
          else
            LIMIT_ARGS=""
          fi
          python tools/podcast_media_audit/run_enhanced_audit.py run \
            --jobs "$JOBS_PATH" \
            --out audit-artifact \
            $LIMIT_ARGS 2>&1 | tee audit-artifact/live_validation_run.log

      - name: Generate repair and series reports
        run: |
          python tools/podcast_media_audit/run_enhanced_audit.py reports \
            --results audit-artifact/live_validation_results.json \
            --proposals audit-artifact/repair_proposals.json \
            --out audit-artifact

      - name: Generate approval-gated transaction preview
        run: |
          cp tools/podcast_media_audit/approvals.example.json audit-artifact/no_repairs_approved.json
          python tools/podcast_media_audit/run_enhanced_audit.py transaction-preview \
            --repo-root . \
            --proposals audit-artifact/repair_proposals.json \
            --approvals audit-artifact/no_repairs_approved.json \
            --out audit-artifact

      - name: Validate evidence structure and pipeline tests
        env:
          JOBS_PATH: ${{ inputs.jobs_path }}
        run: |
          python tools/podcast_media_audit/run_enhanced_audit.py validate \
            --jobs "$JOBS_PATH" \
            --results audit-artifact/live_validation_results.json \
            --proposals audit-artifact/repair_proposals.json \
            --out audit-artifact \
            --result-schema tools/podcast_media_audit/schema/enhanced_validation_result.schema.json \
            --proposal-schema tools/podcast_media_audit/schema/repair_proposal.schema.json
          PYTHONPATH=tools/podcast_media_audit python -m unittest discover \
            -s tools/podcast_media_audit/tests -v | tee audit-artifact/unit_tests.log

      - name: Record repository revision
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          out = {
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'sha': os.environ.get('GITHUB_SHA'),
              'workflowRunId': os.environ.get('GITHUB_RUN_ID'),
              'generatedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          }
          json.dump(out, open('audit-artifact/repository_revision.json', 'w'), indent=2)
          PY

      - name: Build operator summary
        run: |
          python - <<'PY'
          import json
          s = json.load(open('audit-artifact/live_validation_summary.json'))
          lines = [
              '# V23.5C.2B Live Validation Run',
              '',
              f"- Total jobs: {s.get('totalJobs', 0)}",
              f"- Repair proposals: {s.get('repairProposals', 0)}",
              f"- Automatically approvable: {s.get('automaticApprovals', 0)}",
              f"- Human review: {s.get('humanReviewItems', 0)}",
              '',
              '## Status totals',
          ]
          for key, value in sorted(s.get('statuses', {}).items()):
              lines.append(f'- {key}: {value}')
          open('audit-artifact/V23_5C_2B_RUN_SUMMARY.md', 'w').write('\n'.join(lines) + '\n')
          PY

      - name: Upload live-validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: V23.5C.2B-live-podcast-media-validation-evidence
          path: audit-artifact/
          if-no-files-found: error
          retention-days: 30
