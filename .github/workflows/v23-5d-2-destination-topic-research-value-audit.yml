name: V23.5D.2 Destination Topic Research Value Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run destination-topic analysis-only audit
        run: python tools/validate_v23_5d_2.py | tee validation/v23_5d_2_tests.log
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: V23.5D.2-destination-topic-research-value-reports
          path: |
            reports/v23-5d-2/
            validation/v23_5d_2_tests.log
