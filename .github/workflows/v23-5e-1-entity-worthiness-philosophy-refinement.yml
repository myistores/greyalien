name: V23.5E.1 Entity Worthiness Philosophy Refinement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only governance audit
        run: python tools/validate_v23_5e_1.py | tee validation/v23_5e_1_tests.log
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: V23.5E.1-entity-worthiness-philosophy-refinement-reports
          path: |
            reports/v23-5e-1/
            validation/v23_5e_1_tests.log
