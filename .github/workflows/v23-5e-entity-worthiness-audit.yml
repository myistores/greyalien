name: V23.5E Entity Worthiness Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run analysis-only entity worthiness audit
        run: python tools/validate_v23_5e.py | tee validation/v23_5e_tests.log
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: V23.5E-entity-worthiness-audit-reports
          path: |
            reports/v23-5e/
            validation/v23_5e_tests.log
