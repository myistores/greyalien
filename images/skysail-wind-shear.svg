<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#071528"/><stop offset="1" stop-color="#396c99"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#8bdcff"/></marker></defs><rect width="960" height="540" fill="url(#sky)"/><g font-family="sans-serif" fill="white"><text x="40" y="55" font-size="30">Wind shear: air moves differently with height</text><rect x="35" y="90" width="890" height="160" rx="12" fill="#ffffff" opacity=".08"/><rect x="35" y="275" width="890" height="160" rx="12" fill="#ffffff" opacity=".13"/><text x="60" y="125" font-size="24">Upper layer</text><text x="60" y="310" font-size="24">Lower layer</text><text x="60" y="484" font-size="21">Example only: wind direction and speed can both vary.</text></g><g stroke="#8bdcff" stroke-width="7" marker-end="url(#a)"><path d="M90 170H400"/><path d="M480 170H790"/><path d="M350 365H110"/><path d="M760 365H520"/></g></svg>